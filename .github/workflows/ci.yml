name: Python Environment CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Menguji instalasi requirements.txt dari folder python-scripts
        if [ -f python-scripts/requirements.txt ]; then pip install -r python-scripts/requirements.txt; fi

    - name: Verify Environment
      run: |
        echo "✅ All dependencies installed successfully. Environment is B2B-ready."
