name: Job Sniper Crawler

on:
  schedule:
    # Menjadwalkan script agar berjalan otomatis setiap 2 jam
    - cron: '0 */2 * * *'
  # Enable manual run di Actions tab Github
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd python-scripts
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper
        env:
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          cd python-scripts
          python scraper.py
