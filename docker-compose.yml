version: '3.8'

services:
  python-microservices:
    build: ./python-scripts
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  # n8n instance for workflow orchestration
  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
    restart: always
    depends_on:
      - python-microservices
