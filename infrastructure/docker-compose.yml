version: '3.8'

services:
  fastapi_backend:
    build: .
    container_name: enterprise_pipeline_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - INTERNAL_API_KEY=enterprise_secret_2026
      - SERPER_API_KEY=${SERPER_API_KEY}
    restart: unless-stopped
    networks:
      - pipeline_net

  n8n_orchestrator:
    image: n8nio/n8n:latest
    container_name: enterprise_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=none
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped
    networks:
      - pipeline_net

networks:
  pipeline_net:
    driver: bridge

volumes:
  n8n_data:
